[package]
name = "hnb-solo-tracker"
version = "0.1.0"
edition = "2021"
description = "HNB Solo Tracker - count Solo Max, Solo Card and Solo Bank Acc sign-ups"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
rfd = "0.15"
egui-phosphor = "0.7"
ureq = { version = "2", features = ["json"] }
semver = "1"
self-replace = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
strip = true
